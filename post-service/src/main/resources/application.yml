server:
  port: 8083
  servlet:
    context-path: /post-service

spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://localhost:5432/faceclone
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

#  data:
